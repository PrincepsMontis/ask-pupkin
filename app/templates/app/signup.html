{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AskPupkin - Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/signup.css' %}">
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="{% url 'app:index' %}" class="logo_link">AskPupkin</a> 
        </div>
        <div class="search">
            <input type="search" placeholder="search">
        </div>
        <div class="header_links">
            <a href="{% url 'app:login' %}">log in</a>
            <a href="{% url 'app:signup' %}">register</a>
        </div>
    </header>
    <div class="main_container">
        <div class="login">
            <div class="login_name">Registration</div>
            <div class="error">Sorry, this email address is already registred!</div>
            <div class="enters">
                <div class="login_enter">
                    <div class="login_label">Login</div>
                    <div class="login_input">
                        <input type="text" placeholder="Enter your login here" size="20">
                    </div>
                </div>
                <div class="email_enter">
                    <div class="email_label">Email</div>
                    <div class="email_input">
                        <input type="text" placeholder="Enter your email here" size="20">
                    </div>
                </div>
                <div class="nick_enter">
                    <div class="nick_label">NickName</div>
                    <div class="nick_input">
                        <input type="text" placeholder="Enter your nickname here" size="20">
                    </div>
                </div>
                <div class="password_enter">
                    <div class="password_label">Password</div>
                    <div class="password_input">
                        <input type="password" placeholder="Enter your password here" size="20">
                    </div>
                </div>
                <div class="reppass">
                    <div class="reppass_label">Repeat password</div>
                    <div class="reppass_input">
                        <input type="password" placeholder="Repeat your password" size="20">
                    </div>
                </div>
                <div class="choose_img">
                    <div class="img_label">Upload avatar</div>
                    <div class="img_input">
                        <input type="file" placeholder="Take your picture here" size="20" accept="image/png, image/jpeg, image/jpg">
                    </div>
                    <button class="img_button">Choose</button>
                </div>
                <div class="login_foot">
                    <button>Register!</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
